<body class="home">
  <canvas id="scene" aria-hidden="true"></canvas>

  <header class="site-header">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24"><path d="M12 2 21 7v10l-9 5-9-5V7zM12 2 7 15h10zM3 7l4 8M21 7l-4 8M7 15l5 7 5-7"/></svg>
      Spencer Willett

    <nav class="nav">
      <a href="/projects/">Projects</a>
      <a href="/posts/">Posts</a>
      <a href="/resume/">Resume</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Spencer Willett</h1>
    <p>Embedded software engineer · C, GPUs, things that fly</p>
    <nav class="social" aria-label="Social links">
      <a href="https://github.com/GiveThanksAlways" aria-label="GitHub"><svg><use href="/assets/icons.svg#github"/></svg></a>
      <a href="https://x.com/BeGrateful180" aria-label="X"><svg><use href="/assets/icons.svg#x"/></svg></a>

    </nav>

  <aside class="hud mono" aria-label="Flight telemetry">
    <div class="hud-status"><span id="status">PAD · READY</span></div>
    <dl>
      <dt>T+</dt><dd id="t">00:00.0</dd>
      <dt>ALT</dt><dd id="alt">0 m</dd>
      <dt>VEL</dt><dd id="vel">0 m/s</dd>
      <dt>THR</dt><dd id="thr">100%</dd>
      <dt>FUEL</dt><dd><span class="bar"><i id="fuel"></i></span></dd>
      <dt>APO</dt><dd id="apo">0 m</dd>
      <dt>VISITORS</dt><dd data-visitors>…</dd>
    </dl>
  </aside>

  <aside class="controls mono">
    <span><kbd>Space</kbd> launch / engine</span>
    <span><kbd>←</kbd><kbd>→</kbd> tilt</span>
    <span><kbd>↑</kbd><kbd>↓</kbd> throttle</span>
    <span><kbd>R</kbd> reset</span>
    <span class="touch-hint">tap to launch · drag to steer</span>
  </aside>

  <script type="module" src="/assets/launch.js"></script>
  <script src="/assets/telemetry.js" defer></script>
