<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spencer Willett</title>
  <meta name="description" content="Spencer Willett. Launch the rocket.">
  <meta property="og:title" content="Spencer Willett">
  <meta property="og:image" content="https://avatars.githubusercontent.com/u/7727291?v=4">
  <link rel="icon" href="/assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/assets/home.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" } }
  </script>
</head>
<body class="home">
  <canvas id="scene" aria-hidden="true"></canvas>

  <header class="site-header">
    <a class="brand" href="/" aria-label="Spencer Willett, home">
      <svg class="logo"><use href="/assets/icons.svg#logo"/></svg>
    </a>
    <nav class="nav">
      <a href="/projects/">Projects</a>
      <a href="/blog/">Blog</a>
      <a href="/books/">Books</a>
      <a href="/resume/">Resume</a>
    </nav>
  </header>

  <section class="hero">
    <canvas id="halo" aria-hidden="true"></canvas>
    <svg class="logo hero-logo" aria-hidden="true"><use href="/assets/icons.svg#logo"/></svg>
    <h1>Spencer Willett</h1>
    <nav class="social" aria-label="Social links">
      <a href="https://github.com/GiveThanksAlways" aria-label="GitHub"><svg><use href="/assets/icons.svg#github"/></svg></a>
      <a href="https://x.com/BeGrateful180" aria-label="X"><svg><use href="/assets/icons.svg#x"/></svg></a>
      <a href="https://www.youtube.com/@givethanksalways180" aria-label="YouTube"><svg><use href="/assets/icons.svg#youtube"/></svg></a>
      <a href="https://www.twitch.tv/givethanksalways180" aria-label="Twitch"><svg><use href="/assets/icons.svg#twitch"/></svg></a>
      <a href="https://www.linkedin.com/in/spencer-willett" aria-label="LinkedIn"><svg><use href="/assets/icons.svg#linkedin"/></svg></a>
    </nav>
  </section>

  <button class="prompt mono" id="prompt" type="button">
    <span class="mouse-only">Press <kbd>Space</kbd> to launch</span>
    <span class="touch-only">Tap to launch</span>
  </button>

  <aside class="hud mono" aria-label="Flight telemetry">
    <div class="hud-status"><span id="status">PAD · READY</span></div>
    <dl>
      <dt>T+</dt><dd id="t">00:00.0</dd>
      <dt>ALT</dt><dd id="alt">0 m</dd>
      <dt>VEL</dt><dd id="vel">0 m/s</dd>
      <dt>THR</dt><dd id="thr">100%</dd>
      <dt>FUEL</dt><dd><span class="bar"><i id="fuel"></i></span></dd>
      <dt>APO</dt><dd id="apo">0 m</dd>
      <dt>VISITORS</dt><dd data-visitors>…</dd>
    </dl>
  </aside>

  <aside class="controls mono" id="controls">
    <span><kbd>Space</kbd> launch / engine</span>
    <span><kbd>←</kbd><kbd>→</kbd> tilt</span>
    <span><kbd>↑</kbd><kbd>↓</kbd> throttle</span>
    <span><kbd>R</kbd> reset</span>
    <span class="hint">hands off → autopilot lands it</span>
    <span class="touch-only">hands off → autopilot lands it</span>
  </aside>

  <script type="module" src="/assets/launch.js"></script>
  <script src="/assets/halo.js" defer></script>
  <script src="/assets/telemetry.js" defer></script>
</body>
</html>
